# Proces 16 (procesy/16-wymiana-ceo.md): etykiety zgłoszeń wymiany nadaje wydawca, nie nadawca – nadawca spoza repo zwykle
# nie może nadawać etykiet. Kod z gałęzi domyślnej (zaufany), treść zgłoszenia czyta wyłącznie scripts/wymiana.py jako DANE
# (parsowanie JSON, schemat, bramka danych) – do run: trafia tylko numer zgłoszenia przez zmienną środowiskową.
name: Wymiana – etykiety

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: wymiana-etykiety-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  etykiety:
    if: contains(github.event.issue.body, '<!-- wymiana:v1 -->')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Etykiety z rekordu albo poza-schematem
        env:
          GH_TOKEN: ${{ github.token }}
          NR: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: python3 -I scripts/wymiana.py etykietuj "$NR" --repo "$REPO"
