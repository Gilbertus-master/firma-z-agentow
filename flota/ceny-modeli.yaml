# Cennik modeli Claude (USD za 1 mln tokenów) – czyta scripts/koszt.py (pomiar kosztu przebiegu z zapisu sesji).
# Aktualizowany z szablonu razem z klasami modeli (kontrola F-13). Zapis do cache: 5 min = wejście × 1,25; 1 h = wejście × 2.
# Źródło: cennik Claude API (platform.claude.com/docs/en/about-claude/pricing), sprawdzony 11.11.2026.
mnoznik_cache_5m: 1.25
mnoznik_cache_1h: 2.0
modele:
  claude-fable-5-2:  {wejscie: 8.0,  wyjscie: 40.0, cache_odczyt: 0.20}
  claude-fable-5-1:  {wejscie: 10.0, wyjscie: 50.0, cache_odczyt: 0.25}
  claude-opus-5-5:   {wejscie: 4.0,  wyjscie: 20.0, cache_odczyt: 0.20}
  claude-sonnet-5-5: {wejscie: 2.0,  wyjscie: 10.0, cache_odczyt: 0.10}
  claude-haiku-5-5:  {wejscie: 0.10, wyjscie: 0.50, cache_odczyt: 0.01}   # prompty do 100 tys. tokenów; powyżej 0,50 / 2,50 / 0,05
  claude-haiku-5-5-ponad-100k: {wejscie: 0.50, wyjscie: 2.50, cache_odczyt: 0.05}
# drugi próg Haiku 5.5: zapytania z promptem powyżej 100 tys. tokenów (wejście + cache) – wpis <model>-ponad-100k
progi_kontekstu: {claude-haiku-5-5: 100000}
domyslny: claude-opus-5-5   # model spoza listy liczony po tej stawce (i oznaczony w raporcie)
